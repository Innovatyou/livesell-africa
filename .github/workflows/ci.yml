# Every push / pull request: install, type-check, unit + e2e tests (API), tests + build (web), dependency audit,
# and a Docker build of both images. Real provider sandbox suites skip themselves without keys (none are set here).
name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: livesell, POSTGRES_PASSWORD: livesell, POSTGRES_DB: livesell_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U livesell" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      minio:
        image: bitnamilegacy/minio:2025.7.23  # official/bitnami MinIO images were withdrawn from Docker Hub
        env: { MINIO_ROOT_USER: livesell, MINIO_ROOT_PASSWORD: livesell-minio-dev, MINIO_DEFAULT_BUCKETS: livesell-media-test }
        ports: ["9000:9000"]
    env:
      TEST_DATABASE_URL: postgresql://livesell:livesell@localhost:5432/livesell_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/api
        run: npx prisma generate && npx tsc --noEmit && npx nest build
      - working-directory: apps/api
        run: npm test
      - working-directory: apps/api
        run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - working-directory: apps/web
        run: npm test && npx tsc --noEmit && npx next build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit && npx jest && npx expo-doctor
      - run: npx expo export --platform android --platform ios --output-dir /tmp/mobile-export

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t livesell/api:ci .
      - run: docker build -f apps/api/Dockerfile --target migrator -t livesell/migrate:ci .
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t livesell/web:ci .
