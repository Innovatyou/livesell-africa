# Reverse proxy. In production terminate TLS here (or at the LB) and set COOKIE_SECURE=true.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream livesell_api { server api:4000; keepalive 32; }

server {
  listen 80;
  server_tokens off;
  client_max_body_size 10m;   # product media go direct to S3 via presigned URLs (Phase 3)

  location = /health/live  { proxy_pass http://livesell_api; access_log off; }
  location = /health/ready { proxy_pass http://livesell_api; access_log off; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://livesell_api;
  }

  # Provider webhooks (payments incl. per-account paths, Veltrix WhatsApp forwarding): no rate limit (providers retry), body passed untouched for signature checks.
  location ~ ^/api/v1/(payments/[a-z_]+/webhook(/[A-Za-z0-9-]+)?|whatsapp/webhook)$ {
    proxy_request_buffering on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://livesell_api;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://livesell_api;
  }

}
