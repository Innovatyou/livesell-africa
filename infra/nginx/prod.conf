# Production reverse proxy: TLS, security headers, rate limits. Two hosts:
#   app.livesell.africa  → web (Next.js)       api.livesell.africa → API (NestJS)
# Replace the server_name values with your domains. Certificates: /etc/nginx/tls/{fullchain,privkey}.pem.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

upstream livesell_api { server api:4000; keepalive 32; }
upstream livesell_web { server web:3000; keepalive 16; }

# Plain HTTP: certificate challenges, everything else to HTTPS.
server {
  listen 80;
  server_name _;
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
  listen 443 ssl;
  http2 on;
  server_name api.livesell.africa;
  server_tokens off;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 4m;   # media go straight to S3 via presigned URLs; the largest JSON body is a CSV import (3 MB)

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $req_id;

  location = /health/live  { proxy_pass http://livesell_api; access_log off; }
  location = /health/ready { proxy_pass http://livesell_api; access_log off; }

  # Swagger is for development only (the API doesn't serve it in production anyway).
  location /api/docs { return 404; }

  location /api/v1/auth/ { limit_req zone=auth burst=5 nodelay; proxy_pass http://livesell_api; }

  # Provider webhooks (payments, Veltrix forwarding): no rate limit — providers retry — and the body passes untouched
  # for signature checks.
  location ~ ^/api/v1/(payments/[a-z_]+/webhook(/[A-Za-z0-9-]+)?|whatsapp/webhook)$ { proxy_pass http://livesell_api; }

  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://livesell_api; }
  location / { return 404; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.livesell.africa;
  server_tokens off;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 1m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://livesell_web;
  }
}
