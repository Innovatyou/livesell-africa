# Development stack. Production uses separate managed Postgres/Redis and secrets from a vault.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livesell
      POSTGRES_PASSWORD: livesell
      POSTGRES_DB: livesell
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livesell"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for dev/tests. Console: http://localhost:9001
  minio:
    # The official minio/minio and minio/mc images were withdrawn from Docker Hub; Bitnami's frozen archive still
    # ships MinIO (with mc inside). Dev and tests only; staging/production use S3 or R2.
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: livesell
      MINIO_ROOT_PASSWORD: livesell-minio-dev
      MINIO_DEFAULT_BUCKETS: livesell-media,livesell-media-test
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # Creates the dev and test buckets once MinIO is up.
  minio-init:
    image: bitnamilegacy/minio:2025.7.23
    user: root
    depends_on:
      minio: { condition: service_healthy }
    volumes: [./infra/minio/public-logos-policy.json:/policy.json:ro]
    entrypoint: >
      /bin/bash -c "mc alias set local http://minio:9000 livesell livesell-minio-dev &&
                  mc mb --ignore-existing local/livesell-media &&
                  mc mb --ignore-existing local/livesell-media-test &&
                  mc anonymous set-json /policy.json local/livesell-media"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://livesell:livesell@postgres:5432/livesell?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]

  nginx:
    image: nginx:1.27-alpine
    volumes: [./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
